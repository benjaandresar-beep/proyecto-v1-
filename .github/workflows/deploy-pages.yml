name: Desplegar juego en GitHub Pages

on:
  push:
    branches:
      - claude/build-with-questions-1608ob
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /proyecto-v1-
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Landing en raíz, juego en /jugar/
        run: |
          mkdir -p out/jugar
          cp out/index.html out/jugar/index.html
          cp out/landing.html out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
